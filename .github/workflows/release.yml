# Builds Ting ID for Android.
#
# A version tag (v1.2.3) gives the app that version, builds it, and puts it in
# a draft release: the app signed with the release key, its SHA-256 in
# SHA256SUMS and with build provenance, for a person to look over and publish.
# Run by hand, the workflow only builds, to try it; the file stays with the
# run and nothing is signed with the release key or released.
#
# The signing key is only reachable from the `release` environment, which
# waits for approval. The repository variable TING_NODES (comma-separated
# addresses) names the nodes a new installation starts with; without it, the
# app starts with the production nodes it names itself (app/build.gradle.kts).

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  TING_NODES: ${{ vars.TING_NODES }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Nodes a release names must be https: over plain http, anyone on the way
      # could change the answers.
      - name: Node list
        if: startsWith(github.ref, 'refs/tags/') && env.TING_NODES != ''
        run: |
          IFS=',' read -ra nodes <<< "$TING_NODES"
          for n in "${nodes[@]}"; do
            n="$(echo "$n" | xargs)"
            case "$n" in
              https://?*) ;;
              *) echo "::error::TING_NODES names $n, which is not an https address"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The wrapper jar in the repository is Gradle's own, by its published checksum.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tests and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease --no-daemon

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The wrapper jar in the repository is Gradle's own, by its published checksum.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The tag gives the version (app/build.gradle.kts reads GITHUB_REF); every
      # Android instruction set: ARM for phones, x86 for emulators and some tablets.
      - name: Build
        run: ./gradlew :app:assembleRelease --no-daemon
      # Under a name that stays the same from release to release, so a link to
      # the latest release's file keeps working. The build leaves it unsigned;
      # the release job signs it with the release key.
      - name: Collect
        run: |
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "::error::expected one APK, found ${#apks[@]}"
            exit 1
          fi
          mkdir -p out
          cp "${apks[0]}" out/Ting-ID-unsigned.apk
      - name: Try the signing with a throwaway key
        if: github.event_name == 'workflow_dispatch'
        run: |
          export KEYSTORE_PASSWORD="throwaway-$RANDOM$RANDOM"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 -alias ting-id -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway" -storepass:env KEYSTORE_PASSWORD
          export KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/throwaway.jks")"
          bash .github/scripts/sign-apk.sh out/Ting-ID-unsigned.apk "$RUNNER_TEMP/try.apk" "$RUNNER_TEMP/try-certificate"
          echo "Fingerprint: $(cat "$RUNNER_TEMP/try-certificate")"
      # Unsigned until the release job signs it, so kept only until the release
      # is approved.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ting-id-android
          path: out/Ting-ID-unsigned.apk
          if-no-files-found: error
          retention-days: 2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ting-id-android
          path: build
      # The release holds exactly the signed app, its notices and the checksums.
      - name: Sign the app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist
          bash .github/scripts/sign-apk.sh build/Ting-ID-unsigned.apk dist/Ting-ID.apk "$RUNNER_TEMP/certificate"
          cp THIRD_PARTY_NOTICES.md dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Ting ID for Android: \`Ting-ID.apk\`. How to install it is in the [README](https://github.com/${GITHUB_REPOSITORY}#download).

          The app's signing certificate has the SHA-256 fingerprint \`$(cat "$RUNNER_TEMP/certificate")\`; every release is signed with the same one. The file's SHA-256 is in \`SHA256SUMS\`, and \`gh attestation verify Ting-ID.apk --repo ${GITHUB_REPOSITORY}\` checks that it comes from this repository's release workflow. These are early builds.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Ting ID $version" --notes-file "$RUNNER_TEMP/notes.md"
